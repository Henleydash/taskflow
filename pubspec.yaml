name: taskflow
description: "TaskFlow — a production-ready Flutter task manager with categories and priorities."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: any # version pinned transitively by flutter_localizations — don't fix it here
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true
